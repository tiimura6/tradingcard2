    function closeZoom() { document.getElementById('zoom-overlay').style.display = 'none'; }

    /* ========== CAMERA / QR ========== */
    function openCamera() {
        document.getElementById('camera-modal').style.display = 'flex';
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess
        ).catch(() => {
            alert("カメラの起動に失敗しました。");
            document.getElementById('camera-modal').style.display = 'none';
        });
    }
    function closeCamera() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => { document.getElementById('camera-modal').style.display = 'none'; });
        } else {
            document.getElementById('camera-modal').style.display = 'none';
        }
    }
    function onScanSuccess(decodedText) {
        closeCamera();
        const cleanedText = decodedText.trim();
        if (cleanedText === 'gacha-3') {
            checkAndResetDailyGacha();
            if (dailyGachaStorage.count <= 0) { alert("本日のガチャ回数がなくなりました。コードを入力するか明日まで待ってね！"); return; }
            triggerGachaCore();
            return;
        }
        const foundCard = cardsData.find(card => cleanedText === card.id);
        if (foundCard) {
            if (unlockedCards.includes(foundCard.id)) { alert(`No.${foundCard.no} のカードはすでに持っています！`); return; }
            gachaSession.isGachaMode = false;
            currentSingleCard = foundCard;
            document.getElementById('quizTitle').innerText = "🔍 穴埋め問題";
            showQuiz(foundCard);
        } else {
            alert("これは有効なトレカのQRコードではありません。");
        }
    }

    /* ========== GACHA TRIGGER ========== */
    function startGachaViaButton() {
        checkAndResetDailyGacha();
        if (dailyGachaStorage.count <= 0) { alert("本日のガチャ回数がなくなりました。コードを入力するか明日まで待ってね！"); return; }
        triggerGachaCore();
    }
    function triggerGachaCore() {
        const lockedCards = cardsData.filter(card => !unlockedCards.includes(card.id));
        if (lockedCards.length === 0) { alert("すべてのカードをコンプリートしています！"); return; }
        const randomCard = lockedCards[Math.floor(Math.random() * lockedCards.length)];
        gachaSession.isGachaMode = true;
        gachaSession.selectedCard = randomCard;
        gachaSession.userAnswer = "";
        document.getElementById('quizTitle').innerText = "🔥 ガチャクイズチャレンジ";
        showQuiz(randomCard);
    }

    function jumpToCardTab(cardNo) {
        currentTabId = Math.floor((cardNo - 1) / CARDS_PER_PAGE);
        renderTabs();
    }

    /* ========== QUIZ DISPLAY ========== */
    function showQuiz(card) {
        // 例文の（　　）をマークアップしてセット
        const sentence = (card.quiz.example || "___").replace(/___/g,
            '<span class="quiz-blank">（　　）</span>');
        document.getElementById('quizSentence').innerHTML = sentence;

        // 選択肢を生成（正解1 + 不正解3 = 計4択）
        const correctAnswer = card.quiz.answer;
        const allAnswers = Object.values(quizList)
            .map(q => q.answer)
            .filter(a => a !== correctAnswer);
        // シャッフルして3つ抽出
        for (let i = allAnswers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allAnswers[i], allAnswers[j]] = [allAnswers[j], allAnswers[i]];
        }
        const choices = [correctAnswer, ...allAnswers.slice(0, 3)];
        // 選択肢をシャッフル
        for (let i = choices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [choices[i], choices[j]] = [choices[j], choices[i]];
        }

        const choicesEl = document.getElementById('quizChoices');
        choicesEl.innerHTML = '';
        choices.forEach(ans => {
            const btn = document.createElement('button');
            btn.className = 'quiz-choice-btn';
            btn.textContent = ans;
            btn.onclick = () => submitChoice(ans === correctAnswer, card, ans, btn);
            choicesEl.appendChild(btn);
        });

        document.getElementById('quiz-overlay').style.display = 'flex';
    }
    function closeQuiz() {
        document.getElementById('quiz-overlay').style.display = 'none';
        gachaSession.isGachaMode = false;
    }

    /* ========== ANSWER VALIDATION ========== */
    function cleanText(str) {
        if (!str) return "";
        let text = str.toLowerCase().trim();
        text = text.replace(/[!.,?|、。！＿_-]/g, "");
        text = text.replace(/[\u30a1-\u30f6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60));
        return text;
    }
    function validateAnswer(userInput, allowedAnswersString) {
        const user = cleanText(userInput);
        if (user === "") return false;
        return allowedAnswersString.split("/").some(ans => {
            const model = cleanText(ans);
            if (model === "") return false;
            return user.includes(model) || model.includes(user);
        });
    }

    /* ========== SUBMIT CHOICE (4択穴埋め) ========== */
    function submitChoice(isCorrect, card, selectedAnswer, btnEl) {
        // ボタン全体を無効化（二重タップ防止）
        document.querySelectorAll('.quiz-choice-btn').forEach(b => b.disabled = true);
        btnEl.classList.add(isCorrect ? 'correct' : 'wrong');

        // 不正解時は正解ボタンを緑に
        if (!isCorrect) {
            document.querySelectorAll('.quiz-choice-btn').forEach(b => {
                if (b.textContent === card.quiz.answer) b.classList.add('correct');
            });
        }

        setTimeout(() => {
            document.getElementById('quiz-overlay').style.display = 'none';

            if (gachaSession.isGachaMode) {
                dailyGachaStorage.count = Math.max(0, dailyGachaStorage.count - 1);
                localStorage.setItem('dailyGachaStorage', JSON.stringify(dailyGachaStorage));
                checkAndResetDailyGacha();
                evaluateAndShowGachaResult(isCorrect);
            } else {
                updateCombo(isCorrect);
                if (isCorrect) {
                    alert("正解！カードをゲットしたよ！");
                    jumpToCardTab(currentSingleCard.no);
                    startSingleGet(currentSingleCard);
                } else {
                    alert(`残念！正解は「${card.quiz.answer}」でした。また挑戦してね！`);
                }
                currentSingleCard = null;
            }
        }, 700);
    }

    /* ========== GACHA RESULT (with rarity) ========== */
    function evaluateAndShowGachaResult(isCorrect) {
        const container = document.getElementById('gachaContainer');
        container.innerHTML = '';
        document.getElementById('gachaCloseBtn').style.display = 'none';
        document.getElementById('gacha-overlay').style.display = 'flex';

        const card = gachaSession.selectedCard;

        updateCombo(isCorrect);

        const rarity = getRarity(card.no);
        const rc = RARITY_CONFIG[rarity];

        const gachaCardEl = document.createElement('div');
        gachaCardEl.className = 'gacha-card';
        gachaCardEl.id = 'gachaCard-0';

        if (isCorrect) {
            if (!unlockedCards.includes(card.id)) unlockedCards.push(card.id);
            gachaCardEl.innerHTML = `
                <div class="gacha-face gacha-back ${rc.backClass}">？</div>
                <div class="gacha-face gacha-front ${rc.frontClass}">
                    <div class="gacha-rarity-badge gacha-rarity-badge-${rarity}">${rc.label}</div>
                    <img src="${card.img}">
                    <div class="gacha-info">No.${card.no}</div>
                </div>
            `;
            document.getElementById('gachaResultTitle').innerText = `判定：正解！${rc.emoji} ${rc.resultTitle}`;
            jumpToCardTab(card.no);
        } else {
            const primaryAns = card.quiz.meaning.split("/")[0];
            gachaCardEl.innerHTML = `
                <div class="gacha-face gacha-back is-missed">✕<br><span style="font-size:14px;margin-top:10px;display:block;">ハズレ</span></div>
            `;
            document.getElementById('gachaResultTitle').innerText = `判定：不正解（正しい意味は: ${primaryAns}）`;
        }
        container.appendChild(gachaCardEl);
        localStorage.setItem('unlockedCards', JSON.stringify(unlockedCards));

        if (isCorrect) {
            setTimeout(() => {
                document.getElementById('gachaCard-0').classList.add('do-flip');
                fireRarityConfetti(rarity);
            }, 500);
        }
        setTimeout(() => { document.getElementById('gachaCloseBtn').style.display = 'block'; }, 1200);
    }

    /* ========== SINGLE CARD GET (QR scan, with rarity) ========== */
    function startSingleGet(card) {
        const container = document.getElementById('gachaContainer');
        container.innerHTML = '';
        document.getElementById('gachaCloseBtn').style.display = 'none';
        document.getElementById('gacha-overlay').style.display = 'flex';

        const rarity = getRarity(card.no);
        const rc = RARITY_CONFIG[rarity];
        document.getElementById('gachaResultTitle').innerText = `${rc.emoji} ${rc.resultTitle}`;

        if (!unlockedCards.includes(card.id)) {
            unlockedCards.push(card.id);
            localStorage.setItem('unlockedCards', JSON.stringify(unlockedCards));
        }

        const gachaCardEl = document.createElement('div');
        gachaCardEl.className = 'gacha-card';
        gachaCardEl.id = 'gachaCard-0';
        gachaCardEl.innerHTML = `
            <div class="gacha-face gacha-back ${rc.backClass}">？</div>
            <div class="gacha-face gacha-front ${rc.frontClass}">
                <div class="gacha-rarity-badge gacha-rarity-badge-${rarity}">${rc.label}</div>
                <img src="${card.img}">
                <div class="gacha-info">No.${card.no}</div>
            </div>
        `;
        container.appendChild(gachaCardEl);

        setTimeout(() => {
            document.getElementById('gachaCard-0').classList.add('do-flip');
            fireRarityConfetti(rarity);
            document.getElementById('gachaCloseBtn').style.display = 'block';
        }, 500);
    }

    /* ========== CLOSE GACHA ========== */
    function closeGacha() {
        document.getElementById('gacha-overlay').style.display = 'none';
        gachaSession.isGachaMode = false;
        renderCollection();
    }

    /* ========== KEYBOARD SHORTCUTS ========== */
    // (answerInput removed — quiz now uses 4-choice buttons)
    document.getElementById('couponInput').addEventListener('keypress', e => { if (e.key === 'Enter') submitCoupon(); });

    /* ========== INIT ========== */
    updateXPDisplay();
    updateDailyGoalDisplay();
    renderTabs();
    renderCollection();
    checkLoginStreak();
</script>
