        4:  { meaning: "〜を捨てる/あきらめる/見捨てる/〜を置き去りにする/（計画などを）中止する",                     answer: "abandon",               example: "The captain had no choice but to ___ the sinking ship." },
        5:  { meaning: "異常/異常性/変形/異常現象",                                                                      answer: "abnormality",           example: "The test results revealed a slight ___ in her blood pressure." },
        6:  { meaning: "〜を廃止する/（法律などを）なくす/撤廃する",                                                    answer: "abolish",               example: "The government decided to ___ the outdated law." },
        7:  { meaning: "絶対的な/完全な/無条件の/決定的な",                                                              answer: "absolute",              example: "The judge's decision was ___, leaving no room for appeal." },
        8:  { meaning: "〜を吸収する/夢中にさせる/（衝撃などを）和らげる/（知識を）吸い上げる",                        answer: "absorb",                example: "Plants ___ carbon dioxide from the air during photosynthesis." },
        9:  { meaning: "豊富な/大量の/富んだ/満ちあふれた",                                                              answer: "abundant",              example: "The river was ___ with fish after the long rainy season." },
        10: { meaning: "近づきやすい/利用しやすい/理解しやすい/（人柄が）気さくな/交通の便が良い",                     answer: "accessible",            example: "The museum was made ___ to visitors in wheelchairs." },
        11: { meaning: "達成/実績/才能/成果/教養/芸事",                                                                  answer: "accomplishment",        example: "Graduating from university was her greatest ___." },
        12: { meaning: "〜を説明する/〜の割合を占める/〜の原因となる/〜の責任を負う/（行方などを）確認する",           answer: "account for",           example: "Can you ___ the missing funds in the budget?" },
        13: { meaning: "〜を達成する/成し遂げる/（目的を）果たす/得る",                                                  answer: "achieve",               example: "She worked hard to ___ her dream of becoming a doctor." },
        14: { meaning: "達成/成就/業績/偉業/成果",                                                                       answer: "achievement",           example: "Winning the championship was a remarkable ___ for the young team." },
        15: { meaning: "酸/酸性の/酸味のある/（言葉などが）痛烈な/辛辣な",                                             answer: "acid",                  example: "The scientist tested whether the liquid was an ___ or a base." },
        16: { meaning: "〜を獲得する/身につける/（会社などを）買収する/手に入れる",                                     answer: "acquire",               example: "The company plans to ___ a smaller competitor next year." },
        17: { meaning: "〜を適応させる/合わせる/慣れる/（小説などを）改変する/脚色する",                               answer: "adapt",                 example: "It took weeks for him to ___ to the new environment." },
        18: { meaning: "適応/順応/改作/脚色/翻案",                                                                       answer: "adaptation",            example: "The film is an ___ of a bestselling novel from the 1990s." },
        19: { meaning: "〜を増やす/加える/〜を増大させる",                                                               answer: "add to",                example: "The unexpected storm only served to ___ their troubles." },
        20: { meaning: "これに加えて/さらに言えば/おまけに",                                                             answer: "add to this",           example: "___ the fact that the train was late, and you can see why we missed the meeting." },
        21: { meaning: "〜に話しかける/（問題に）取り組む/住所/演説/〜に宛名を書く",                                   answer: "address",               example: "The president will ___ the nation on television tonight." },
        22: { meaning: "〜を調整する/合わせる/慣れる/（姿勢などを）正す/（保険金を）査定する",                        answer: "adjust",                example: "She had to ___ her schedule to fit the new meeting time." },
        23: { meaning: "行政/管理/政府/経営/運営/政権/（薬の）投与",                                                    answer: "administration",        example: "The school's ___ announced new policies for the upcoming year." },
        24: { meaning: "感嘆/賞賛/憧れ/賛美",                                                                            answer: "admiration",            example: "He looked at the ancient painting with deep ___." },
        25: { meaning: "明らかに/誰もが認めるように/言いにくいが/確かに",                                               answer: "admittedly",            example: "___, the plan is risky, but the potential reward is worth it." },
        26: { meaning: "〜を採用する/（養子に）迎える/（方針などを）選ぶ/（法案を）可決する",                         answer: "adopt",                 example: "The couple decided to ___ a child from overseas." },
        27: { meaning: "採用/養子縁組/選定/可決",                                                                        answer: "adoption",              example: "The ___ of the new policy was approved by the board of directors." },
        28: { meaning: "〜を主張する/支持する/擁護者/代弁者/弁護士/〜を勧める",                                        answer: "advocate",              example: "She became a strong ___ for environmental protection in her community." },
        29: { meaning: "〜に影響を与える/作用する/（病気が人・体を）冒す/〜の心を動かす/〜の振りをする",               answer: "affect",                example: "Lack of sleep can seriously ___ your ability to concentrate." },
        30: { meaning: "手頃な/購入しやすい/安価な/無理のない",                                                          answer: "affordable",            example: "They were looking for an ___ apartment in the city center." },
        31: { meaning: "動揺した/興奮した/動転した/波立った",                                                            answer: "agitated",              example: "The speaker became visibly ___ when asked about the scandal." },
        32: { meaning: "農業の/農作の/農学の/土地の",                                                                    answer: "agricultural",          example: "This region is well known for its ___ products, especially high-quality rice." },
        33: { meaning: "警戒/用心深さ/機敏さ/覚醒（状態）",                                                             answer: "alertness",             example: "The security guard's ___ prevented a break-in at the warehouse." },
        34: { meaning: "同盟を結んだ/関連した/連合した/同類の",                                                          answer: "allied",                example: "The ___ forces worked together to defeat their common enemy." },
        35: { meaning: "〜と並んで/〜と一緒に/〜のそばに/〜と同時に",                                                   answer: "alongside",             example: "She worked ___ her mentor for three years before leading her own team." },
        36: { meaning: "代わりの/選択肢/二者択一の/オルタナティブな/既存のものに代わる",                               answer: "alternative",           example: "If the main road is blocked, we will need to find an ___ route." },
        37: { meaning: "アルミニウムの/アルミ製の",                                                                      answer: "aluminum",              example: "The bicycle frame was made of a lightweight ___ alloy." },
        38: { meaning: "素人くさい/下手な/未熟な/アマチュアらしい",                                                     answer: "amateurish",            example: "The performance was criticized for looking ___ and poorly rehearsed." },
        39: { meaning: "アミノ酸",                                                                                       answer: "amino acid",            example: "Proteins are made up of long chains of ___." },
        40: { meaning: "〜を楽しませる/面白がらせる/（時間を）つぶさせる",                                              answer: "amuse",                 example: "The magician's clever tricks never failed to ___ the audience." },
        41: { meaning: "釣り人/（特に）竿釣り師",                                                                        answer: "angler",                example: "The ___ waited patiently for hours at the edge of the quiet river." },
        42: { meaning: "苦痛/苦悩/悲痛/激痛/悶え",                                                                      answer: "anguish",               example: "She cried out in ___ when she received the terrible news." },
        43: { meaning: "動物行動学者/動物行動主義者",                                                                    answer: "animal behaviorist",    example: "The ___ spent years studying the social habits of wild chimpanzees." },
        44: { meaning: "抗菌の/防腐の/抗菌剤/抗菌ペプチド",                                                             answer: "antibacterial",         example: "The soap contained ___ agents that help prevent infection." },
        45: { meaning: "期待/予想/先取り/楽しみにして待つこと/予期",                                                    answer: "anticipation",          example: "The children waited in ___ for the presents to be unwrapped." },
        46: { meaning: "明白な/一見〜らしい/見かけ上の/表面的な",                                                       answer: "apparent",              example: "It was ___ from his expression that he was not happy with the decision." },
        47: { meaning: "〜を求める/〜に訴えかける/〜を懇願する/〜を要請する",                                           answer: "appeal for",            example: "The charity decided to ___ donations following the devastating disaster." },
        48: { meaning: "応募者/志願者/申請者/受験生",                                                                    answer: "applicant",             example: "Each ___ was required to submit a written essay along with their application form." },
        49: { meaning: "〜に適用される/〜に当てはまる/〜に申し込む/〜に宛てる/〜に塗る",                              answer: "apply to",              example: "The same rules ___ all students, regardless of their grade level." },
        50: { meaning: "適切な/ふさわしい/固有の/〜に特有の/〜を私物化する/〜を予算に計上する",                       answer: "appropriate",           example: "Please wear ___ clothing for the formal ceremony this evening." }
    };

    /* ========== CARD DATA ========== */
    const cardsData = [];
    for (let i = 1; i <= TOTAL_CARDS; i++) {
        const quiz = quizList[i] || { meaning: `意味 ${i}`, answer: `Word ${i}` };
        cardsData.push({ id: `card-${i}`, img: `photo/${i}.png`, no: i, quiz: quiz });
    }

    /* ========== STATE ========== */
    let unlockedCards = JSON.parse(localStorage.getItem('unlockedCards')) || [];
    let html5QrcodeScanner = null;
    let currentSingleCard = null;

    let gachaSession = { isGachaMode: false, selectedCard: null, userAnswer: "" };

    let dailyGachaStorage = JSON.parse(localStorage.getItem('dailyGachaStorage')) || {
        lastDate: "", count: 1, usedCoupons: []
    };
    if (!dailyGachaStorage.usedCoupons) dailyGachaStorage.usedCoupons = [];

    /* ========== LOGIN STREAK STATE ========== */
    let loginStreak = JSON.parse(localStorage.getItem('loginStreak')) || {
        lastDate: "", streak: 0, bonusClaimed: false
    };

    /* ========== COMBO STATE ========== */
    let comboCount = 0;

    /* ========== XP / LEVEL STATE ========== */
    const LEVEL_TITLES = [
        "見習い魔法使い","魔法使いの卵","呪文詠唱者","魔法探求者","秘術の使い手",
        "魔法騎士","賢者の弟子","星読みの者","月の守護者","大魔法使い",
        "伝説の魔法使い","魔法界の英雄","世界樹の守者","時空の探求者","不死の賢者"
    ];
    const XP_PER_LEVEL = 100;

    let xpData = JSON.parse(localStorage.getItem('xpData')) || { xp: 0, level: 1 };

    function addXP(amount, originEl) {
        const prevLevel = xpData.level;
        xpData.xp += amount;
        while (xpData.xp >= XP_PER_LEVEL) {
            xpData.xp -= XP_PER_LEVEL;
            xpData.level++;
        }
        localStorage.setItem('xpData', JSON.stringify(xpData));
        updateXPDisplay();
        if (xpData.level > prevLevel) showLevelUpToast(xpData.level);
        if (originEl) spawnXPFloat(`+${amount} XP`, originEl);
    }

    function updateXPDisplay() {
        const lv = Math.min(xpData.level, LEVEL_TITLES.length);
        const title = LEVEL_TITLES[lv - 1] || LEVEL_TITLES[LEVEL_TITLES.length - 1];
        const el = document.getElementById('levelBadge');
        const bar = document.getElementById('xpBarFill');
        const label = document.getElementById('xpLabel');
        if (el) el.textContent = `Lv.${xpData.level} ${title}`;
        if (bar) bar.style.width = Math.round((xpData.xp / XP_PER_LEVEL) * 100) + '%';
        if (label) label.textContent = `${xpData.xp}/${XP_PER_LEVEL} XP`;
    }

    function showLevelUpToast(lv) {
        const t = document.getElementById('levelupToast');
        if (!t) return;
        const title = LEVEL_TITLES[Math.min(lv, LEVEL_TITLES.length) - 1];
        t.textContent = `✨ Lv.${lv} ${title} にレベルアップ！`;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2600);
        confetti({ particleCount: 60, spread: 50, origin: { y: 0.4 } });
    }

    function spawnXPFloat(text, originEl) {
        const rect = originEl.getBoundingClientRect();
        const el = document.createElement('div');
        el.className = 'xp-float';
        el.textContent = text;
        el.style.left = (rect.left + rect.width / 2 - 20) + 'px';
        el.style.top = (rect.top - 10) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1300);
    }

    /* ========== DAILY GOAL STATE ========== */
    const DAILY_GOAL = 10;
    let dailyStudyData = JSON.parse(localStorage.getItem('dailyStudyData')) || { date: "", count: 0 };

    function checkDailyStudyReset() {
        const today = new Date().toLocaleDateString();
        if (dailyStudyData.date !== today) {
            dailyStudyData = { date: today, count: 0 };
            localStorage.setItem('dailyStudyData', JSON.stringify(dailyStudyData));
        }
    }

    function incrementDailyStudy() {
        checkDailyStudyReset();
        dailyStudyData.count++;
        localStorage.setItem('dailyStudyData', JSON.stringify(dailyStudyData));
        updateDailyGoalDisplay();
        if (dailyStudyData.count === DAILY_GOAL) {
            setTimeout(() => {
                confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
                const n = document.getElementById('comboBonusNotice');
                if (n) { n.textContent = '🎉 本日の目標達成！素晴らしい！'; n.style.display='block'; setTimeout(()=>n.style.display='none', 2800); }
            }, 300);
        }
    }

    function updateDailyGoalDisplay() {
        checkDailyStudyReset();
        const count = dailyStudyData.count;
        const pct = Math.min(100, Math.round((count / DAILY_GOAL) * 100));
        const fill = document.getElementById('dailyGoalFill');
        const txt = document.getElementById('dailyGoalText');
        if (fill) { fill.style.width = pct + '%'; fill.className = 'daily-goal-bar-fill' + (count >= DAILY_GOAL ? ' complete' : ''); }
        if (txt) txt.textContent = `${count} / ${DAILY_GOAL}枚`;
    }

    /* ========== WEAK CARDS (苦手カード) STATE ========== */
    let weakCards = JSON.parse(localStorage.getItem('weakCards')) || [];

    function markWeak(cardNo) {
        if (!weakCards.includes(cardNo)) { weakCards.push(cardNo); localStorage.setItem('weakCards', JSON.stringify(weakCards)); }
    }
    function unmarkWeak(cardNo) {
        weakCards = weakCards.filter(n => n !== cardNo);
        localStorage.setItem('weakCards', JSON.stringify(weakCards));
    }

    /* ========== STUDY MODE STATE ========== */
    let studyState = { cards: [], index: 0, flipped: false, mode: 'all' };

    function openStudyMode(mode) {
        studyState.mode = mode || 'all';
        let pool;
        if (mode === 'weak') {
            pool = cardsData.filter(c => weakCards.includes(c.no) && unlockedCards.includes(c.no));
            document.getElementById('studyModeTitle').textContent = '⚠️ 苦手カード復習';
        } else {
            pool = cardsData.filter(c => unlockedCards.includes(c.no));
            document.getElementById('studyModeTitle').textContent = '📖 学習モード';
        }
        if (pool.length === 0) {
            alert(mode === 'weak' ? '苦手カードがありません！' : 'まずカードをアンロックしてください！');
            return;
        }
        studyState.cards = pool;
        studyState.index = 0;
        studyState.flipped = false;
        document.getElementById('study-overlay').style.display = 'flex';
        document.getElementById('studyComplete').style.display = 'none';
        document.getElementById('studyFlipCard').style.display = '';
        document.getElementById('studyAssessment').style.display = 'flex';
        document.getElementById('studyNavRow').style.display = 'flex';
        renderStudyCard();
    }

    function closeStudyMode() {
        document.getElementById('study-overlay').style.display = 'none';
        renderTabs();
    }

    function renderStudyCard() {
        const card = studyState.cards[studyState.index];
        if (!card) return;
        studyState.flipped = false;
        const flipEl = document.getElementById('studyFlipCard');
        flipEl.classList.remove('flipped');

        // Image
        document.getElementById('studyCardImg').src = card.img;
        // English word
        const eng = card.quiz.answer;
        document.getElementById('studyEnglishWord').textContent = eng;
        document.getElementById('studyEnglishWordBack').textContent = eng;
        // Meaning
        document.getElementById('studyMeaning').textContent = card.quiz.meaning;
        // Progress
        const total = studyState.cards.length;
        const cur = studyState.index + 1;
        document.getElementById('studyProgressText').textContent = `${cur} / ${total}`;
        document.getElementById('studyCardCounter').textContent = `${cur} / ${total}`;
        // Assessment hidden until flip
        document.getElementById('studyAssessment').classList.add('hidden');
        // Weak indicator on front
        const weakNote = flipEl.querySelector('.weak-note');
        if (weakNote) weakNote.remove();
        if (weakCards.includes(card.no)) {
            const badge = document.createElement('div');
            badge.className = 'weak-note';
            badge.style.cssText = 'position:absolute;top:10px;right:10px;background:#8a1a1a;color:#ffe0e0;font-size:11px;padding:3px 8px;border-radius:8px;font-family:Noto Serif JP,serif;';
            badge.textContent = '⚠️ 苦手';
            document.getElementById('studyFaceFront').appendChild(badge);
        }
    }

    function onStudyCardTap() {
        if (studyState.flipped) return;
        studyState.flipped = true;
        document.getElementById('studyFlipCard').classList.add('flipped');
        document.getElementById('studyAssessment').classList.remove('hidden');
    }

    function assessCard(knew) {
        const card = studyState.cards[studyState.index];
        if (knew) {
            unmarkWeak(card.no);
            addXP(10, document.getElementById('studyAssessment'));
        } else {
            markWeak(card.no);
            addXP(2, document.getElementById('studyAssessment'));
        }
        incrementDailyStudy();
        const next = studyState.index + 1;
        if (next >= studyState.cards.length) {
            showStudyComplete();
        } else {
            studyState.index = next;
            renderStudyCard();
        }
    }

    function showStudyComplete() {
        document.getElementById('studyFlipCard').style.display = 'none';
        document.getElementById('studyAssessment').style.display = 'none';
        document.getElementById('studyNavRow').style.display = 'none';
        const weakCount = studyState.cards.filter(c => weakCards.includes(c.no)).length;
        document.getElementById('studyCompleteTitle').textContent = '学習完了！🎓';
        document.getElementById('studyCompleteSub').textContent =
            `全${studyState.cards.length}枚を復習しました。苦手カード: ${weakCount}枚`;
        document.getElementById('studyComplete').style.display = 'flex';
        confetti({ particleCount: 100, spread: 60, origin: { y: 0.5 } });
    }

    function studyNavPrev() {
        if (studyState.index > 0) { studyState.index--; renderStudyCard(); }
    }
    function studyNavNext() {
        if (studyState.index < studyState.cards.length - 1) { studyState.index++; renderStudyCard(); }
    }

    /* ========== DAILY GACHA RESET ========== */
    function checkAndResetDailyGacha() {
        const todayStr = new Date().toLocaleDateString();
        if (dailyGachaStorage.lastDate !== todayStr) {
            dailyGachaStorage.lastDate = todayStr;
            dailyGachaStorage.count = 1;
            localStorage.setItem('dailyGachaStorage', JSON.stringify(dailyGachaStorage));
        }
        const remaining = dailyGachaStorage.count;
        document.getElementById('gachaLimitInfo').innerText = remaining > 0
            ? `本日のガチャ残り: ${remaining}回`
            : `本日のガチャ残り: 0回 (次回は明日)`;
        document.getElementById('directGachaBtn').disabled = (remaining <= 0);
    }

    /* ========== LOGIN STREAK LOGIC ========== */
    function checkLoginStreak() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayStr = today.toLocaleDateString('ja-JP');
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toLocaleDateString('ja-JP');

        if (loginStreak.lastDate === todayStr) {
            updateStreakDisplay();
            return;
        }

        if (loginStreak.lastDate === yesterdayStr) {
            loginStreak.streak++;
        } else {
            loginStreak.streak = 1;
        }
        loginStreak.lastDate = todayStr;
        loginStreak.bonusClaimed = false;
        localStorage.setItem('loginStreak', JSON.stringify(loginStreak));

        const bonus = getStreakBonus(loginStreak.streak);
        if (bonus > 0) {
            dailyGachaStorage.count += bonus;
            loginStreak.bonusClaimed = true;
            localStorage.setItem('loginStreak', JSON.stringify(loginStreak));
            localStorage.setItem('dailyGachaStorage', JSON.stringify(dailyGachaStorage));
        }

        updateStreakDisplay();
        checkAndResetDailyGacha();

        if (bonus > 0) {
            setTimeout(() => showStreakBonusModal(loginStreak.streak, bonus), 900);
        }
    }

    function getStreakBonus(streak) {
        if (streak % 7 === 0) return 3;
        if (streak % 3 === 0) return 1;
        return 0;
    }

    function updateStreakDisplay() {
        const el = document.getElementById('streakInfo');
        if (el) el.innerText = `🔥 ${loginStreak.streak}日連続`;
    }

    function showStreakBonusModal(streak, bonus) {
        let dayLabel = `${streak}日連続ログイン！`;
        if (streak % 30 === 0) dayLabel = `🏆 ${streak}日連続達成！`;
        else if (streak % 14 === 0) dayLabel = `✨ 2週間連続達成！`;
        else if (streak % 7  === 0) dayLabel = `🌟 1週間連続達成！`;

        document.getElementById('streakDayLabel').innerText = dayLabel;
        document.getElementById('streakBonusMsg').innerText = `ガチャ ＋${bonus}回 ゲット！`;
        document.getElementById('streak-bonus-overlay').style.display = 'flex';
        confetti({ particleCount: 70, spread: 55, origin: { y: 0.7 } });
    }

    function closeStreakBonusModal() {
        document.getElementById('streak-bonus-overlay').style.display = 'none';
    }

    /* ========== COMBO LOGIC ========== */
    function updateCombo(isCorrect) {
        if (isCorrect) {
            comboCount++;
            updateComboDisplay();
            const milestone = checkComboMilestone(comboCount);
            if (milestone) {
                dailyGachaStorage.count += milestone.count;
                localStorage.setItem('dailyGachaStorage', JSON.stringify(dailyGachaStorage));
                checkAndResetDailyGacha();
                setTimeout(() => showComboBonusNotice(milestone.msg, milestone.count), 1300);
            }
        } else {
            comboCount = 0;
            updateComboDisplay();
        }
    }

    function checkComboMilestone(combo) {
        if (combo === 3)  return { count: 1, msg: `🔥 3連続正解！ ガチャ+1回！` };
        if (combo === 5)  return { count: 1, msg: `⚡ 5連続正解！ ガチャ+1回！` };
        if (combo === 10) return { count: 3, msg: `🌟 10連続正解！ ガチャ+3回！` };
        if (combo > 10 && combo % 10 === 0) return { count: 3, msg: `✨ ${combo}連続正解！ ガチャ+3回！` };
        return null;
    }

    function updateComboDisplay() {
        const el = document.getElementById('comboDisplay');
        const countEl = document.getElementById('comboCount');
        if (!el || !countEl) return;
        if (comboCount >= 2) {
            countEl.innerText = comboCount;
            el.style.display = 'block';
            el.classList.remove('combo-pulse');
            void el.offsetWidth;
            el.classList.add('combo-pulse');
        } else {
            el.style.display = 'none';
        }
    }

    function showComboBonusNotice(msg, bonusCount) {
        const el = document.getElementById('comboBonusNotice');
        if (!el) return;
        el.innerText = msg;
        el.style.display = 'block';
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = 'slideUp 0.4s ease-out';
        confetti({ particleCount: 60, spread: 50, origin: { y: 0.85 } });
        setTimeout(() => { el.style.display = 'none'; }, 2800);
    }

    /* ========== RARITY CONFETTI ========== */
    function fireRarityConfetti(rarity) {
        if (rarity === 'UR') {
            confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 }, colors: ['#FFD700','#FFA500','#FF8C00','#FFECB3','#fff'] });
            setTimeout(() => confetti({ particleCount: 80, angle: 120, spread: 60, origin: { x: 0, y: 0.6 }, colors: ['#FFD700','#FFA500'] }), 350);
            setTimeout(() => confetti({ particleCount: 80, angle: 60,  spread: 60, origin: { x: 1, y: 0.6 }, colors: ['#FFD700','#FFA500'] }), 650);
        } else if (rarity === 'SR') {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#E1BEE7','#CE93D8','#AB47BC','#7B1FA2','#fff'] });
        } else if (rarity === 'R') {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#BBDEFB','#64B5F6','#1E88E5','#1565C0','#fff'] });
        } else {
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }
    }

    /* ========== COUPON ========== */
    function openCouponModal() {
        document.getElementById('couponInput').value = '';
        document.getElementById('coupon-overlay').style.display = 'flex';
        setTimeout(() => document.getElementById('couponInput').focus(), 100);
    }
    function closeCouponModal() {
        document.getElementById('coupon-overlay').style.display = 'none';
    }
    function submitCoupon() {
        const inputCode = document.getElementById('couponInput').value.trim().toUpperCase();
        if (inputCode === "") { alert("コードを入力してください。"); return; }
        if (!(inputCode in VALID_COUPONS)) { alert("無効なクーポンコードです。"); return; }
        if (dailyGachaStorage.usedCoupons.includes(inputCode)) { alert("このコードはすでに使用されています。"); return; }
        const rewardCount = VALID_COUPONS[inputCode];
        dailyGachaStorage.count += rewardCount;
        dailyGachaStorage.usedCoupons.push(inputCode);
        localStorage.setItem('dailyGachaStorage', JSON.stringify(dailyGachaStorage));
        closeCouponModal();
        checkAndResetDailyGacha();
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
        alert("クーポン適用成功！🎉");
    }

    /* ========== TABS ========== */
    let activeTab = 'all'; // 'all' | 'weak'
    function renderTabs() {
        const tabsContainer = document.getElementById('tabsContainer');
        tabsContainer.innerHTML = '';
        // "すべて" tab
        const allBtn = document.createElement('button');
        allBtn.className = `tab-button ${activeTab === 'all' ? 'active' : ''}`;
        allBtn.innerText = `📚 すべて (${unlockedCards.length})`;
        allBtn.onclick = () => { activeTab = 'all'; renderTabs(); renderCollection(); };
        tabsContainer.appendChild(allBtn);
        // "苦手カード" tab
        const weakCount = weakCards.filter(no => unlockedCards.some(id => id === `card-${no}`)).length;
        const weakBtn = document.createElement('button');
        weakBtn.className = `tab-button ${activeTab === 'weak' ? 'active' : ''}`;
        weakBtn.style.borderColor = activeTab === 'weak' ? '#c04030' : 'rgba(180,80,60,0.4)';
        weakBtn.innerText = `⚠️ 苦手 (${weakCount})`;
        weakBtn.onclick = () => { activeTab = 'weak'; renderTabs(); renderCollection(); };
        tabsContainer.appendChild(weakBtn);
        // "学習モードで復習" quick-action (weak only)
        if (activeTab === 'weak' && weakCount > 0) {
            const studyWeakBtn = document.createElement('button');
            studyWeakBtn.className = 'tab-button';
            studyWeakBtn.style.background = 'rgba(60,20,100,0.8)';
            studyWeakBtn.innerText = '▶ 苦手を学習';
            studyWeakBtn.onclick = () => openStudyMode('weak');
            tabsContainer.appendChild(studyWeakBtn);
        }
    }

    /* ========== COLLECTION RENDER ========== */
    function renderCollection() {
        checkAndResetDailyGacha();
        document.getElementById('collectionCounter').innerText = `${unlockedCards.length} / ${TOTAL_CARDS}`;
        const grid = document.getElementById('collectionGrid');
        grid.innerHTML = '';

        let displayCards;
        if (activeTab === 'weak') {
            displayCards = cardsData.filter(c => weakCards.includes(c.no) && unlockedCards.includes(c.id));
            if (displayCards.length === 0) {
                grid.innerHTML = '<div style="color:#a090c0;text-align:center;padding:30px;font-size:14px;font-family:Noto Serif JP,serif;grid-column:1/-1;">苦手カードはありません！<br>学習モードで✗をつけたカードがここに表示されます。</div>';
                return;
            }
        } else {
            displayCards = cardsData;
        }

        displayCards.forEach(card => {
            const isUnlocked = unlockedCards.includes(card.id);
            const rarity = getRarity(card.no);
            const isWeak = weakCards.includes(card.no);
            const cardEl = document.createElement('div');
            cardEl.className = `card-container ${isUnlocked ? `card-rarity-${rarity}` : 'locked'}`;
            cardEl.onclick = () => tapCard(card, isUnlocked);

            let cardVisualHTML = isUnlocked
                ? `<div style="position:relative">
                       <img src="${card.img}" alt="No.${card.no}" class="card-img" loading="lazy">
                       <div class="rarity-badge rarity-badge-${rarity}">${rarity}</div>
                       ${isWeak ? '<div style="position:absolute;bottom:2px;left:2px;background:#8a1a1a;color:#ffe0e0;font-size:9px;padding:2px 5px;border-radius:3px;font-family:Noto Serif JP,serif;">⚠️苦手</div>' : ''}
                   </div>`
                : `<div class="locked-placeholder">？</div>`;

            cardEl.innerHTML = `${cardVisualHTML}<div class="card-info"><div>No.${card.no}</div></div>`;
            grid.appendChild(cardEl);
        });
    }

    /* ========== CARD TAP / ZOOM ========== */
    function tapCard(card, isUnlocked) {
        if (!isUnlocked) return;
        const rarity = getRarity(card.no);
        const zoomContent = document.getElementById('zoomContent');
        zoomContent.innerHTML = `
            <img src="${card.img}" alt="No.${card.no}">
            <div class="zoom-info">
                <div class="rarity-badge rarity-badge-${rarity}" style="position:static;display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;margin-bottom:6px;">${rarity}</div>
                <div>No.${card.no}</div>
            </div>
        `;
        document.getElementById('zoom-overlay').style.display = 'flex';
    }
    function closeZoom() { document.getElementById('zoom-overlay').style.display = 'none'; }

    /* ========== CAMERA / QR ========== */
    function openCamera() {
        document.getElementById('camera-modal').style.display = 'flex';
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess
        ).catch(() => {
            alert("カメラの起動に失敗しました。");
            document.getElementById('camera-modal').style.display = 'none';
        });
    }
    function closeCamera() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => { document.getElementById('camera-modal').style.display = 'none'; });
        } else {
            document.getElementById('camera-modal').style.display = 'none';
        }
    }
    function onScanSuccess(decodedText) {
        closeCamera();
        const cleanedText = decodedText.trim();
        if (cleanedText === 'gacha-3') {
            checkAndResetDailyGacha();
            if (dailyGachaStorage.count <= 0) { alert("本日のガチャ回数がなくなりました。コードを入力するか明日まで待ってね！"); return; }
            triggerGachaCore();
            return;
        }
        const foundCard = cardsData.find(card => cleanedText === card.id);
        if (foundCard) {
            if (unlockedCards.includes(foundCard.id)) { alert(`No.${foundCard.no} のカードはすでに持っています！`); return; }
            gachaSession.isGachaMode = false;
            currentSingleCard = foundCard;
            document.getElementById('quizTitle').innerText = "🔍 穴埋め問題";
            showQuiz(foundCard);
        } else {
            alert("これは有効なトレカのQRコードではありません。");
        }
    }

    /* ========== GACHA TRIGGER ========== */
    function startGachaViaButton() {
        checkAndResetDailyGacha();
        if (dailyGachaStorage.count <= 0) { alert("本日のガチャ回数がなくなりました。コードを入力するか明日まで待ってね！"); return; }
        triggerGachaCore();
    }
    function triggerGachaCore() {
        const lockedCards = cardsData.filter(card => !unlockedCards.includes(card.id));
        if (lockedCards.length === 0) { alert("すべてのカードをコンプリートしています！"); return; }
        const randomCard = lockedCards[Math.floor(Math.random() * lockedCards.length)];
        gachaSession.isGachaMode = true;
        gachaSession.selectedCard = randomCard;
        gachaSession.userAnswer = "";
        document.getElementById('quizTitle').innerText = "🔥 ガチャクイズチャレンジ";
        showQuiz(randomCard);
    }

    function jumpToCardTab(cardNo) {
        currentTabId = Math.floor((cardNo - 1) / CARDS_PER_PAGE);
        renderTabs();
    }

    /* ========== QUIZ DISPLAY ========== */
    function showQuiz(card) {
        // 例文の（　　）をマークアップしてセット
        const sentence = (card.quiz.example || "___").replace(/___/g,
            '<span class="quiz-blank">（　　）</span>');
        document.getElementById('quizSentence').innerHTML = sentence;

        // 選択肢を生成（正解1 + 不正解3 = 計4択）
        const correctAnswer = card.quiz.answer;
        const allAnswers = Object.values(quizList)
            .map(q => q.answer)
            .filter(a => a !== correctAnswer);
        // シャッフルして3つ抽出
        for (let i = allAnswers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allAnswers[i], allAnswers[j]] = [allAnswers[j], allAnswers[i]];
        }
        const choices = [correctAnswer, ...allAnswers.slice(0, 3)];
        // 選択肢をシャッフル
        for (let i = choices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [choices[i], choices[j]] = [choices[j], choices[i]];
        }

        const choicesEl = document.getElementById('quizChoices');
        choicesEl.innerHTML = '';
        choices.forEach(ans => {
            const btn = document.createElement('button');
            btn.className = 'quiz-choice-btn';
            btn.textContent = ans;
            btn.onclick = () => submitChoice(ans === correctAnswer, card, ans, btn);
            choicesEl.appendChild(btn);
        });

        document.getElementById('quiz-overlay').style.display = 'flex';
    }
    function closeQuiz() {
        document.getElementById('quiz-overlay').style.display = 'none';
        gachaSession.isGachaMode = false;
    }

    /* ========== ANSWER VALIDATION ========== */
    function cleanText(str) {
        if (!str) return "";
        let text = str.toLowerCase().trim();
        text = text.replace(/[!.,?|、。！＿_-]/g, "");
        text = text.replace(/[\u30a1-\u30f6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60));
        return text;
    }
    function validateAnswer(userInput, allowedAnswersString) {
        const user = cleanText(userInput);
        if (user === "") return false;
        return allowedAnswersString.split("/").some(ans => {
            const model = cleanText(ans);
            if (model === "") return false;
            return user.includes(model) || model.includes(user);
        });
    }

    /* ========== SUBMIT CHOICE (4択穴埋め) ========== */
    function submitChoice(isCorrect, card, selectedAnswer, btnEl) {
        // ボタン全体を無効化（二重タップ防止）
        document.querySelectorAll('.quiz-choice-btn').forEach(b => b.disabled = true);
        btnEl.classList.add(isCorrect ? 'correct' : 'wrong');

        // 不正解時は正解ボタンを緑に
        if (!isCorrect) {
            document.querySelectorAll('.quiz-choice-btn').forEach(b => {
                if (b.textContent === card.quiz.answer) b.classList.add('correct');
            });
        }

        setTimeout(() => {
            document.getElementById('quiz-overlay').style.display = 'none';

            if (gachaSession.isGachaMode) {
                dailyGachaStorage.count = Math.max(0, dailyGachaStorage.count - 1);
                localStorage.setItem('dailyGachaStorage', JSON.stringify(dailyGachaStorage));
                checkAndResetDailyGacha();
                evaluateAndShowGachaResult(isCorrect);
            } else {
                updateCombo(isCorrect);
                if (isCorrect) {
                    alert("正解！カードをゲットしたよ！");
                    jumpToCardTab(currentSingleCard.no);
                    startSingleGet(currentSingleCard);
                } else {
                    alert(`残念！正解は「${card.quiz.answer}」でした。また挑戦してね！`);
                }
                currentSingleCard = null;
            }
        }, 700);
    }

    /* ========== GACHA RESULT (with rarity) ========== */
    function evaluateAndShowGachaResult(isCorrect) {
        const container = document.getElementById('gachaContainer');
        container.innerHTML = '';
        document.getElementById('gachaCloseBtn').style.display = 'none';
        document.getElementById('gacha-overlay').style.display = 'flex';

        const card = gachaSession.selectedCard;

        updateCombo(isCorrect);

        const rarity = getRarity(card.no);
        const rc = RARITY_CONFIG[rarity];

        const gachaCardEl = document.createElement('div');
        gachaCardEl.className = 'gacha-card';
        gachaCardEl.id = 'gachaCard-0';

        if (isCorrect) {
            if (!unlockedCards.includes(card.id)) unlockedCards.push(card.id);
            gachaCardEl.innerHTML = `
                <div class="gacha-face gacha-back ${rc.backClass}">？</div>
                <div class="gacha-face gacha-front ${rc.frontClass}">
                    <div class="gacha-rarity-badge gacha-rarity-badge-${rarity}">${rc.label}</div>
                    <img src="${card.img}">
                    <div class="gacha-info">No.${card.no}</div>
                </div>
            `;
            document.getElementById('gachaResultTitle').innerText = `判定：正解！${rc.emoji} ${rc.resultTitle}`;
            jumpToCardTab(card.no);
        } else {
            const primaryAns = card.quiz.meaning.split("/")[0];
            gachaCardEl.innerHTML = `
                <div class="gacha-face gacha-back is-missed">✕<br><span style="font-size:14px;margin-top:10px;display:block;">ハズレ</span></div>
            `;
            document.getElementById('gachaResultTitle').innerText = `判定：不正解（正しい意味は: ${primaryAns}）`;
        }
        container.appendChild(gachaCardEl);
        localStorage.setItem('unlockedCards', JSON.stringify(unlockedCards));

        if (isCorrect) {
            setTimeout(() => {
                document.getElementById('gachaCard-0').classList.add('do-flip');
                fireRarityConfetti(rarity);
            }, 500);
        }
        setTimeout(() => { document.getElementById('gachaCloseBtn').style.display = 'block'; }, 1200);
    }

    /* ========== SINGLE CARD GET (QR scan, with rarity) ========== */
    function startSingleGet(card) {
        const container = document.getElementById('gachaContainer');
        container.innerHTML = '';
        document.getElementById('gachaCloseBtn').style.display = 'none';
        document.getElementById('gacha-overlay').style.display = 'flex';

        const rarity = getRarity(card.no);
        const rc = RARITY_CONFIG[rarity];
        document.getElementById('gachaResultTitle').innerText = `${rc.emoji} ${rc.resultTitle}`;

        if (!unlockedCards.includes(card.id)) {
            unlockedCards.push(card.id);
            localStorage.setItem('unlockedCards', JSON.stringify(unlockedCards));
        }

        const gachaCardEl = document.createElement('div');
        gachaCardEl.className = 'gacha-card';
        gachaCardEl.id = 'gachaCard-0';
        gachaCardEl.innerHTML = `
            <div class="gacha-face gacha-back ${rc.backClass}">？</div>
            <div class="gacha-face gacha-front ${rc.frontClass}">
                <div class="gacha-rarity-badge gacha-rarity-badge-${rarity}">${rc.label}</div>
                <img src="${card.img}">
                <div class="gacha-info">No.${card.no}</div>
            </div>
        `;
        container.appendChild(gachaCardEl);

        setTimeout(() => {
            document.getElementById('gachaCard-0').classList.add('do-flip');
            fireRarityConfetti(rarity);
            document.getElementById('gachaCloseBtn').style.display = 'block';
        }, 500);
    }

    /* ========== CLOSE GACHA ========== */
    function closeGacha() {
        document.getElementById('gacha-overlay').style.display = 'none';
        gachaSession.isGachaMode = false;
        renderCollection();
    }

    /* ========== KEYBOARD SHORTCUTS ========== */
    // (answerInput removed — quiz now uses 4-choice buttons)
    document.getElementById('couponInput').addEventListener('keypress', e => { if (e.key === 'Enter') submitCoupon(); });

    /* ========== INIT ========== */
    updateXPDisplay();
    updateDailyGoalDisplay();
    renderTabs();
    renderCollection();
    checkLoginStreak();
</script>
</body>
